<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found | Gautam Taneja</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0f17;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 480px;
        padding: 2rem;
      }
      h1 {
        font-size: 5rem;
        margin: 0;
        color: #38bdf8;
        font-weight: 800;
        line-height: 1;
      }
      h2 {
        font-size: 1.5rem;
        margin: 1rem 0 0.5rem;
        color: #f1f5f9;
      }
      p {
        color: #94a3b8;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        color: #ffffff;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The engineering documentation or route you were looking for does not exist or has been relocated.</p>
      <a href="./" class="btn">Return to Portfolio</a>
    </div>
  </body>
</html>
